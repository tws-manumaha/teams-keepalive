name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pynput

      - name: Syntax check
        run: |
          python -m py_compile teams_keepalive.py
          python -m py_compile generate_icon.py
          echo "All syntax checks passed"

      - name: Generate icon
        run: |
          python generate_icon.py
          test -f teams_keepalive.ico && echo "Icon generated successfully"

      - name: Import check
        run: |
          python -c "import teams_keepalive; print('Import OK')"
